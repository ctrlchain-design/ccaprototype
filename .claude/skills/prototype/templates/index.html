<!doctype html>
<!--
  CtrlChain prototype starter.

  Copied from .claude/skills/prototype/templates/index.html. Everything below is
  the platform's own markup and CSS — see design-system/dist/ and the /prototype
  skill. Replace the page content; leave the shell and the two <link>s alone.

  class="light" on the root element is not decoration: the platform tokens flip
  to dark under prefers-color-scheme, so without it the prototype renders dark
  on any reviewer whose OS is in dark mode.

  Never write a literal opening html tag in this comment. build-screens.py takes
  the FIRST thing in the file that looks like one and reads data-screen off it,
  so a mention up here steals the page's name and the prototype registers under
  its folder instead of the name it declares.
-->
<html lang="en" class="light" data-screen="CHANGE.ME">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PROTOTYPE NAME · CtrlChain</title>

    <link rel="stylesheet" href="../design-system/dist/fonts/fonts.css" />
    <link rel="stylesheet" href="../design-system/dist/ds/index.css" />
    <link rel="stylesheet" href="../_shared/prototype.css" />

    <style>
      /*
        The bundle ships no page-level reset — the app's own index.html has it.

        Everything else lives in ../_shared/prototype.css: the cca-root rule that
        makes the page clickable at all, drawer and overlay geometry, the
        form-field subscript fix, and the header link. Read its comments before
        adding anything here — most of what a prototype needs is already solved.
      */
      html,
      body {
        margin: 0;
        height: 100%;
      }
    </style>
  </head>

  <body>
    <!--
      cca-main > .appContent is the platform's shell grid:

        grid-template-areas: "sidenav submenu header"
                             "sidenav submenu topbar"
                             "sidenav submenu page";

      Children claim an area by element or class — cca-side-menu, cca-side-submenu,
      cca-header, cca-message-banner, .page. That ancestry is load-bearing: the
      rail's sizing, hover and active states are all scoped to
      `cca-main .appContent cca-side-menu`, so they vanish if you flatten it.
    -->
    <cca-root>
      <cca-main>
        <div class="appContent">
          <!--
            Rail. Do NOT write rail markup here. It lives in
            _shared/shell-markup.js, because the rail is the same on every screen
            of the product and a copy per prototype is how two prototypes end up
            disagreeing about what the product looks like.

            data-rail names the active domain, spelled as the rail spells it:
            Booking, Home, Dashboard, Inbox, Taskboard, Shipper TMS, Carrier TMS,
            Enterprise, Finance, Integrations, Release Notes, Addressbook, Admin.

            Need a new rail item, or a change to one? Edit shell-markup.js and
            every prototype gets it.
          -->
          <cca-side-menu data-rail="Shipper TMS"></cca-side-menu>

          <!-- Submenu — routes within the domain. Delete for a full-width prototype. -->
          <cca-side-submenu>
            <div class="submenu-container">
              <div class="min-h-15 w-full content-center border-b border-neutral-default">
                <img class="mr-auto max-w-32 px-4 py-3" src="../design-system/dist/assets/images/ctrlchain-text-green.svg" alt="CtrlChain" />
              </div>
              <div class="flex w-full flex-col gap-4 border-b border-neutral-default p-4">
                <button ccaButton class="cca-btn cca-btn--primary icon-button-rounded w-full shadow">
                  <cca-icon><mat-icon class="mat-icon notranslate cca-icon cca-icon-plus mat-ligature-font mat-icon-inline" aria-hidden="true"></mat-icon></cca-icon>New trip
                </button>
              </div>
              <div class="flex w-full flex-col gap-4">
                <span class="mt-4 pl-4 font-medium text-neutral-caption">Trips</span>
                <a class="sub-item active" href="#">
                  <cca-icon><mat-icon class="mat-icon notranslate cca-icon cca-icon-list mat-ligature-font mat-icon-inline" aria-hidden="true"></mat-icon></cca-icon>
                  <span class="text-cca-base font-normal wrap-break-word">Overview</span>
                </a>
                <a class="sub-item" href="#">
                  <cca-icon><mat-icon class="mat-icon notranslate cca-icon cca-icon-calendar mat-ligature-font mat-icon-inline" aria-hidden="true"></mat-icon></cca-icon>
                  <span class="text-cca-base font-normal wrap-break-word">Planning</span>
                </a>
              </div>
            </div>
          </cca-side-submenu>

          <!-- Top bar — 60px, composed from utilities. See components/top-bar.html -->
          <cca-header>
            <div class="sticky z-10 flex h-15 w-auto max-w-full items-center border-b border-neutral-default surface-neutral-light">
              <div class="flex flex-row items-center gap-2 pl-6">
                <h1 class="text-cca-label-lg text-neutral-title">Page title</h1>
              </div>
              <!--
                Trailing cluster — Contact Support, notifications, language
                switch, avatar. Shared, in _shared/shell-markup.js: it is
                identical on every screen. data-initials sets the avatar.

                Note that staging shows neither Contact Support nor the flag but
                production has both, so do not "correct" the shared version
                against a staging screenshot.
              -->
              <div data-top-bar-trailing data-initials="DS"></div>
            </div>
          </cca-header>

          <!--
            .page owns the scroll and the 16px gutter. Its direct child inherits
            full height (`.page > *` is `height: inherit`), so give it exactly one
            child — a layout wrapper — and put the content inside that.
            proto-hug then releases that inherited height so a short page does not
            leave a tall empty panel below its content. Drop the class for a view
            that genuinely fills the viewport.
          -->
          <div class="page">
            <div class="proto-hug flex flex-col gap-4">
              <!-- PAGE CONTENT. Compose from design-system/dist/components/*.html. -->
              <!--
                A CARD IS `page-container`. It carries radius-xl, a 1px
                border-neutral-default, surface-neutral-light and padding that
                steps 4 -> 6 at a breakpoint. This used to hand-roll
                `rounded-lg border ... p-4` — the wrong radius, no responsive
                padding, and it taught everyone who copied it to invent one.
                The <h2> is classless on purpose: the platform styles headings.
              -->
              <div class="page-container">
                <h2>Card</h2>
                <p class="text-cca-base-sm text-neutral-subtitle">
                  Replace this. Copy real markup out of the component pages — do not
                  write your own hex values, pixel sizes or radii.
                </p>
                <div class="mt-4 flex gap-2">
                  <button ccaButton class="cca-btn cca-btn--primary">Primary action</button>
                  <button ccaButton class="cca-btn cca-btn--secondary">Secondary</button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </cca-main>
    </cca-root>
    <!--
      Shared modules load BEFORE any page script: data.js defines the records a
      page renders, shell-markup.js fills in the rail and top bar, routes.js
      resolves data-screen links, nav.js makes the rail navigate, and shell.js
      wires Dark and Collapse. shell-markup.js must come before routes.js and
      nav.js, which wire what it renders. Put a page's own script after these.
    -->
    <script src="../_shared/data.js"></script>
    <script src="../_shared/screens.js"></script>
    <script src="../_shared/shell-markup.js"></script>
    <script src="../_shared/routes.js"></script>
    <script src="../_shared/nav.js"></script>
    <script src="../_shared/shell.js"></script>
  </body>
</html>
