<!doctype html>
<!--
  OMS — warehouse orders in the Shipper TMS orders list
  =====================================================

  The premise: warehouse orders (OMS) stop being a separate list and join the
  transport orders already in Shipper TMS › Orders. To an operator, an Outbound
  order and the transport order collecting it are ONE job — two records only
  because the system keeps them apart.

  This prototype exists to show what that combining actually costs, because
  "put them in the same table" is not free. Four things had to change:

    1. CATEGORY IS ITS OWN COLUMN, because the type word cannot carry the
       domain. Transport types are Brokerage, MT, SaaS and Own Fleet;
       warehouse types are Inbound and Outbound; an INVOICE ORDER HAS NO TYPE
       AT ALL. So there is no word to infer the domain from on an invoice row,
       and with three domains a reader would be memorising which of eight
       words belongs where. An explicit column is also sortable and
       filterable, which inference never was.

       The two badge columns use the label badge's two variants — Category
       filled `neutral`, type outlined `neutral emphasis-outline` — so they
       tell themselves apart, with the heavier carrying the coarser fact.
       Each column has ONE fixed variant; an earlier revision instead varied
       a single column's badge by row data, which is what stopped that column
       being one thing.

    2. ORDER TYPE IS A FILTER, NOT A CONTROL OF ITS OWN. A warehouse planner
       should not scroll past transport orders all day, so the list needs
       narrowing — but the product already has a mechanism for that, and the
       row above the table already belongs to it.

       This page carried a bespoke set of cca-chip type toggles in that row for
       several revisions. It was wrong twice: it collided with the pinned-filters
       row (see orders-pinned-filters/), and it looked like a filter without
       being one — hard-coded values the Filters drawer knew nothing about. So
       Order Type joins the filter list, and reaches the row only by being
       pinned, as any filter does.

    3. TRANSIT STATUS STOPS BEING A COLUMN. A warehouse order is not in
       transit — it is being picked, or waiting for a dock slot — so a Transit
       Status column is empty on every warehouse row, and a column that is
       blank half the time earns its width badly. It folds into Status as a
       second line instead: state on top, timeliness under it, present only
       where it means something. Absence in a stacked cell reads as "does not
       apply" without needing a dash and a tooltip to explain itself.

       This was found by building it. The first version kept the column and put
       an em dash in it; at 1600px the table then needed 10 columns in 916px of
       page, cells wrapped to four lines and rows were 153px tall. The column
       was the thing to cut.

    4. WHERE AND WHEN BECOME REAL COLUMNS, and Linked is added.

       Both record types have two ends — the warehouse is simply one of them
       (origin for an Outbound, destination for an Inbound). That is the honest
       shared concept, and it is what makes the two comparable in one table at
       all. It started as a single "Location" column holding a
       `Rotterdam → Berlin` route, which turned out to be unfilterable: no way
       to ask for everything leaving Rotterdam when both ends share a cell.

       So place, date and time are each their own column, per end — six in
       total, each sorted on separately. The date and time columns both use the
       design system's own cca-date-cell rather than bare text; it needs
       linking by hand, which the <head> explains. 14 columns do not fit the
       page and the table scrolls; that is the real cost of combining, and
       worth seeing rather than hiding.

       Linked is the payoff — the counterpart records, so a fan-out (one
       Outbound, two trailers on the same lane) is visible in the list instead
       of only on a detail page.

  Everything renders from _shared/data.js. Warehouse orders live in their own
  array there and this page asks for both with `allOrders()` — see the comment
  on WAREHOUSE_ORDERS for why they are not simply appended to `orders`.

  Never write a literal opening html tag in this comment: build-screens.py reads
  data-screen off the first thing that looks like one.
-->
<html lang="en" class="light" data-screen="oms.orders">

      to be linked by hand. Nothing else in the bundle renders a date, so a
      table with Date and Time columns cannot avoid it.

      It goes BEFORE _shared/prototype.css so the shared layer can still

              <!--

              <!-- The combined table -->
              <div class="mt-4 overflow-x-auto">
                <!--
                  COLUMN WIDTHS live here, in a colgroup, in the platform's own
                  --spacing units (1 unit = 0.25rem) so every width is a
                  multiple of the design system's scale, not a made-up pixel.

                  Three things had to be true for these to actually apply, and
                  each one was a trap:

                  1. NOT w-* UTILITIES. `.mat-mdc-table` sets `min-width: 100%`
                     UNLAYERED in material-data.css, and unlayered CSS beats
                     Tailwind's layered utilities whatever the import order — so
                     `min-w-max` on the table computed to 100%, not
                     max-content. Worse, `w-22`, which this table carried on the
                     type column (copied from orders-pinned-filters), IS NOT A

                  2. `table-layout: fixed`. On `auto`, a colgroup width is only
                     a hint, and content that cannot wrap overrides it — the
                     date/time cells held their 314px and every one of the 13
                     widths was ignored. Fixed makes the colgroup authoritative.

                  3. THE DATE/TIME CELL HAD TO GET NARROWER. It is what forced

                  Total is 1952px against ~1613px of page, so the table still
                  scrolls horizontally. That is not a spacing failure — 13
                  columns carrying two date-time ranges do not fit one screen,
                  and the scroll is the honest consequence.
                -->
                <!--
                  COLUMN WIDTHS in a colgroup, in the platform's --spacing units
                  (1 unit = 0.25rem), so every width is a multiple of the design
                  system's scale rather than a made-up pixel.

                  Not w-* utilities: `.mat-mdc-table` sets `min-width: 100%`
                  UNLAYERED in material-data.css, and unlayered CSS beats
                  Tailwind's layered utilities whatever the import order — so
                  `min-w-max` computed to 100%. And `w-22`, which this table
                  carried on the type column (copied from
                  orders-pinned-filters), IS NOT A CLASS THE BUNDLE DEFINES.

                  `table-layout: fixed` is what makes the colgroup
                  authoritative; on `auto` a width is only a hint that
                  unwrappable content overrides.

                  FIXED LAYOUT CLIPS SILENTLY, which is the cost. A badge is
                  `whitespace-nowrap` inside an inline-flex, so when it does not
                  fit it just gets cut — no wrap, no ellipsis, no error. Status
                  is 47 units because "Searching for Carrier" is 155px at the
                  14px badge size and the cell has 14px padding each side; 40
                  units clipped it by 23px. Measure the widest real value before
                  narrowing any of these.

                  And `td.scrollWidth > td.clientWidth` DOES NOT CATCH IT — the
                  td reports no overflow while its inline-flex child hangs out
                  of the content box. Compare the child's width against
                  clientWidth minus padding instead.

                  2328px total, so it scrolls — and that is what the design does
                  too. The Orders table in Figma
                  (IvHbK3LeammCOdlHQQYxwy, node 11187:289914) is 3193px wide
                  natively, and the OMS warehouse table
                  (29Ixi12L8wlQPTh3oVg0ao, node 103:57407) is 5004px across
                  ~24 columns. A wide scrolling table is the pattern here, not
                  a failure to fit.
                -->

    <script>
      'use strict';

      // Both domains, from the shared fixtures. `orders` alone is transport-only.
      const ALL = window.CCA_DATA.allOrders();

      /*
       * Only the system view. Warehouse and Transport were saved views here at
       * one point and came out again: a second scope mechanism sitting next to
       * the type chips meant two controls that could disagree, and a reviewer
       * having to work out which one won. The chips do the whole job.
       *
       * With one view there are no tabs to show — a single tab is not a choice,
       * and the app agrees: Contracted Lanes has no saved views and renders no
       * tab row. The strip below is written and dormant, so adding a view back
       * brings it and its kebab menu back with no other change.
       */
      const VIEWS = [{ name: 'All', system: true }];
      let activeView = 'All';

      /*
       * Order types, grouped by domain. The flavour is the domain (change 1):
       * transport keeps the `neutral` the list uses today, warehouse takes
       * `accent-blue`. Both are real cca-label-badge flavours — see
       * design-system/dist/ds/components/label-badge.css.
       */
      /*
       * The order-type vocabulary, and which domain each type belongs to.
       *
       * Nothing renders from this any more — the badge just prints `o.type` —
       * but it is the list the Order Type filter offers, and it records the
       * grouping that the list itself cannot show. Kept here so the next person
       * does not have to reconstruct it from the fixtures.
       */
      const TYPES = [
        { name: 'Brokerage', domain: 'transport' },
        { name: 'MT', domain: 'transport' },
        { name: 'SaaS', domain: 'transport' },
        { name: 'Own Fleet', domain: 'transport' },
        { name: 'Inbound', domain: 'warehouse' },
        { name: 'Outbound', domain: 'warehouse' },
      ];

      /*
       * The three domains, and what the Category column calls each.
       *
       * This column exists because the type word stopped being able to carry
       * the domain. With two domains it just about worked — Inbound and
       * Outbound are not transport words — but a third breaks it: an invoice
       * order has NO type at all, so there is no word to read the domain from.
       * Making it an explicit column also makes it sortable and filterable,
       * which inference never was.
       */
      const CATEGORY = { transport: 'Transport', warehouse: 'Warehouse', invoice: 'Invoice' };

      /*
       * ONE COMPONENT FOR EVERY TYPE, whichever domain it belongs to.
       *
       * An earlier revision filled the warehouse badges with `accent-blue` and
       * left transport outlined, so the two domains differed in form. That is
       * out: a badge is a badge, and splitting one component into two
       * treatments by data value makes the column stop being a single thing.
       * The domain is legible from the type word itself — Inbound and Outbound
       * are not transport words — and from the Linked column beside it.
       *
       * So every badge is `neutral emphasis-outline`, exactly as the existing
       * orders list renders it.
       */
      const TYPE_FLAVOR = 'neutral';

      /*
       * Category uses the label badge's OTHER variant: filled `neutral`, where
       * the type badge is `neutral emphasis-outline`. Filled against outlined
       * makes the two columns tell themselves apart at a glance, and the
       * heavier of the two carries the coarser fact.
       *
       * Note this is NOT the thing that was rejected earlier. That was one
       * column rendering one component two ways depending on the row's data.
       * This is two different columns, each with its own fixed variant — every
       * badge in the Category column looks the same as every other, and so does
       * every badge in the type column.
       */
      /*
       * `border border-transparent` for the same reason the status badge has
       * one: this is the FILLED variant, so it carries no border of its own and
       * came out 2px shorter than the three outlined badges beside it. The
       * invisible border equalises the box model. `leading-4` also goes — the
       * 16px line-height comes from text-cca-label-sm already, and stating it
       * twice was how this drifted.
       */
      const categoryBadge = (domain) =>
        `<cca-label-badge><div class="flex w-fit items-center gap-1 rounded-lg border border-transparent whitespace-nowrap px-1.5 py-0.5 text-cca-label-sm font-normal neutral">${
          CATEGORY[domain] || domain
        }</div></cca-label-badge>`;

      // ------------------------------------------------------------- helpers
      const icon = (name) =>
        `<cca-icon><mat-icon class="mat-icon notranslate cca-icon cca-icon-${name} mat-ligature-font mat-icon-inline" aria-hidden="true"></mat-icon></cca-icon>`;

      // Smaller than the documented label badge: the design system has no size
      // modifier, so the size is the type utility one step down the scale with
      // tighter vertical padding. Matches the existing orders list.
      // Smaller than the documented label badge: the design system has no size
      // modifier, so the size is the type utility one step down the scale with
      // tighter vertical padding. Matches the existing orders list.
      const smallLabelBadge = (text, flavor) =>
        `<cca-label-badge><div class="flex w-fit items-center gap-1 rounded-lg whitespace-nowrap px-1.5 py-0.5 text-cca-label-sm leading-4 font-normal ${flavor} emphasis-outline">${text}</div></cca-label-badge>`;

      /* =================================================================
       * THE BADGE SIZE SCALE
       *
       * From the Core UI badge component itself —
       * uQMin4yCGCADtRxsP1mtR7, node 10046:2752. Every family has THREE
       * steps, and each family starts at a different base:
       *
       *                        Default   Compact   Extra Compact
       *   Workflow Badge         16px      14px        12px      (status)
       *   Attention flag         14px      12px        10px      (transit)
       *   category               14px      12px        10px      (type)
       *   Counter                12px      10px         8px      (numerical)
       *
       * THIS TABLE USES COMPACT THROUGHOUT — status 14, flag 12, category
       * 12 — which is what the Orders table uses too, and is right for a
       * dense table. The Figma type styles name the same thing from the
       * other end: badge-large = 14px, badge-medium = 12px.
       *
       * Note the flag and the category sit one step BELOW the status at any
       * given step. That keeps the flag subordinate, which its own
       * component description makes a rule: "Always smaller than status and
       * visually subordinate." An earlier revision here had it inverted —
       * status at 12 next to a 14px flag — so the subordinate badge was the
       * louder of the two.
       *
       * Rendered heights per step, from the component:
       *
       *   Workflow Badge   16px -> 36/28   14px -> 24   12px -> 20
       *   Attention flag   14px -> 28      12px -> 20   10px -> 18
       *   category         14px -> 28      12px -> 20   10px -> 18
       *
       * WHAT THIS TABLE USES: 12px for all three, which is the only size where
       * the families share a height. See statusBadge for why matching heights
       * beat following the per-family step here.
       *
       *   status  12/16 -> text-cca-label-sm   px-1.5 py-0.5  + transparent border
       *   flag    12/16 -> text-cca-label-sm   px-1.5 py-0.5
       *   type    12/16 -> text-cca-label-sm   px-1.5 py-0.5
       *
       * PADDING IS PART OF THE SIZE STEP, not a free choice — all three take
       * 6px/2px. Careful with the FE doc page here: it pairs its 14px status
       * example with px-2.5 py-1, which is Default's padding, so copying that
       * markup wholesale gives a smaller type in a bigger box.
       *
       * ⚠ THE FE EXPORT DOES NOT CARRY THIS SCALE. There are no size
       * modifier classes on any of these components (cca-text-badge's
       * .compact / .extra-compact are the only ones in the bundle), so size
       * is composed from type and padding utilities on the inner div. And
       * components/badge.html documents only part of it: two compositions
       * for the status badge, one each for the flag and the label badge. The
       * flag's single example is its 14px Default, so the 12px Compact this
       * table needs has no example to copy — it is composed here from a real
       * step on the type scale, not invented. Worth raising with FE.
       *
       * Other variants in the component, for whoever needs them next:
       *   Tones            Positive, Warning, Critical, Info, Neutral
       *   Status emphasis  Default (filled pill) or Soft (dot plus text)
       *   category         Fill or Outline, plus Spotlight for "Recommended"
       *   Attention flag   with icon, icon-only, or Overflow ("+1 more")
       *
       * Figma also says "Omit the icon in dense tables to save space" — this
       * is a dense table, and neither badge here carries one.
       * ================================================================= */

      /*
       * TRANSIT STATUS uses cca-attention-flag-badge — the "flag" badge.
       * libs/ui/src, isDesignSystem true, documented in
       * design-system/dist/components/badge.html, and this markup is copied
       * from there verbatim.
       *
       * It is a different component from the Status badge on purpose: in the
       * Figma Orders table the two sit SIDE BY SIDE as separate columns, Status
       * filled and Transit Status an outlined pill.
       *
       * ⚠ ITS VARIANTS ARE ONLY neutral / accent-blue / warning / danger —
       * no green, no purple. The fixtures used to carry `match`, `highlight`
       * and `primary` for transit, none of which this component defines, so
       * they would have rendered as an unstyled borderless box. Remapped in
       * data.js: On time and Early are accent-blue, Late is warning.
       */
      const flagBadge = (text, flavor) =>
        `<cca-attention-flag-badge><div class="font-medium flex w-fit items-center justify-center rounded-full whitespace-nowrap border gap-1 px-1.5 py-0.5 text-cca-label-sm ${flavor}"><span>${text}</span></div></cca-attention-flag-badge>`;

      /*
       * ALL THREE BADGES ARE THE SAME HEIGHT — 12px type, 6px/2px padding.
       *
       * The component's Compact step is not one size across the families:
       *
       *   Workflow Badge   16px -> 36/28   14px -> 24   12px -> 20
       *   Attention flag   14px -> 28      12px -> 20   10px -> 18
       *   category         14px -> 28      12px -> 20   10px -> 18
       *
       * So Workflow's Compact is 14px/24px tall while the flag's and the
       * category's are 12px/20px. Side by side in one row that reads as a
       * mismatch, and 12px is the ONLY size where all three families land on
       * the same height. Hence 12px everywhere — Compact for the flag and the
       * category, one step further down for the status.
       *
       * This is a deliberate departure from the per-family scale: the
       * component would have the status a step larger. Matching heights in a
       * dense table won out.
       *
       * `border border-transparent` on the status badge is doing real work,
       * not decoration. A CSS border adds to an auto height, so the two
       * bordered badges come out 2px taller than an unbordered one at the same
       * type and padding. An invisible border gives the status the same box
       * model, and all three measure identically.
       *
       * Note this lands at 22px, not the 20px Figma reports. Figma draws its
       * stroke inside the hug box; CSS puts a border outside the line box, and
       * there is no utility for a 1px inset. 22px consistently beats 20px on
       * one badge and 22px on the others.
       */
      const statusBadge = (text, flavor) =>
        `<cca-status-badge><div class="flex w-fit items-center justify-center rounded-full border border-transparent py-0.5 whitespace-nowrap font-medium px-1.5 text-cca-label-sm ${flavor}">${text}</div></cca-status-badge>`;

      /*
       * "Does not apply", said out loud — used by the Linked column, where a
       * blank cell would read as missing data. The title says WHY there is no
       * counterpart, which is the part a reader cannot infer. aria-label carries
       * it too, since a screen reader gets nothing from a dash.
       */
      const notApplicable = (why) =>
        `<span class="text-cca-base-sm text-neutral-caption" title="${why}" aria-label="${why}">—</span>`;

      // ------------------------------------------------------- what's on screen
      /*
       * Everything, unfiltered. Narrowing this list is the Filters drawer's
       * job and the pinned row's — see orders-pinned-filters/, where that flow
       * is prototyped. This page is about the combined table itself.
       */
      const visibleOrders = () => ALL;

      /*
       * Pinned filters.
       *
       * The same shape orders-pinned-filters uses: a filter knows its name and
       * whether it is pinned, and only the pinned ones reach the row above the
       * table. Order Type is the new entry — the one this page adds — and it is
       * pinned here so the row is not empty in a review.
       *
       * `showPinned` is the drawer toggle. It is true here because the toggle
       * itself is prototyped next door; this page only needs to show that
       * Order Type takes its place among the existing filters rather than
       * inventing a control beside them.
       */
      const FILTERS = [
        { name: 'Category', pinned: true },
        { name: 'Order Type', pinned: true },
        { name: 'Account Manager', pinned: true },
        { name: 'Assigned Operator', pinned: false },
        { name: 'Carrier Assignment Status', pinned: false },
        { name: 'Customer Invoice Status', pinned: false },
      ];
      let showPinned = true;

      /*
       * The real pinned-filter chip — a pin glyph and the filter's name, on the
       * neutral-dark surface. Markup shared with orders-pinned-filters so the
       * two pages cannot drift. `pinned` is the icon name; `pin` does not exist
       * in the font.
       */
      function renderPinnedRow() {
        const row = document.getElementById('pinned-filters-row');
        const pinned = FILTERS.filter((f) => f.pinned);
        row.hidden = !showPinned || pinned.length === 0;
        row.innerHTML = pinned
          .map(
            (f) => `
          <span class="flex max-w-80 items-center gap-1 rounded-lg surface-neutral-dark px-2 py-1 text-cca-base text-neutral-body">
            ${icon('pinned')}
            <span class="truncate">${f.name}</span>
          </span>`
          )
          .join('');
      }

      // ------------------------------------------------------------ saved views
      function renderViews() {
        if (VIEWS.length < 2) {
          // Including the filler, or an empty rule would hang under the toolbar
          // with no tabs above it.
          document.getElementById('view-tabs').innerHTML = '';
          return;
        }

        const tab = (v) => {
          const active = v.name === activeView;
          return `
            <div class="flex h-12 w-40 shrink-0 cursor-pointer items-center justify-center gap-1.5 overflow-clip surface-neutral-light px-3 py-2 ${
              active ? 'border-b-2 border-brand-default' : 'border-b border-neutral-default'
            }" role="tab" aria-selected="${active}" data-view="${v.name}">
              ${v.system ? icon('home') : ''}
              <span class="truncate text-cca-label-lg ${active ? 'text-brand-default' : 'text-neutral-caption'}">${v.name}</span>
              ${
                active && !v.system
                  ? `<button ccaButton class="cca-btn cca-btn--icon cca-btn--icon-only cca-btn--x-small" aria-label="View options">${icon('ellipsis-vertical')}</button>`
                  : ''
              }
            </div>`;
        };

        document.getElementById('view-tabs').innerHTML =
          VIEWS.map(tab).join('') +
          // Filler keeps the bottom border running to the edge of the row.
          '<div class="h-12 flex-1 border-b border-neutral-default surface-neutral-light"></div>';
      }

      // ------------------------------------------------------------- the table
      /*
       * Origin and Destination (change 4).
       *
       * This is the column pair that makes the two record types genuinely
       * comparable, and it is also why they belong in one table at all: a
       * transport order and a warehouse order BOTH have two ends. The warehouse
       * is simply one of them —
       *
       *   Outbound — the warehouse IS the origin, goods leave it
       *   Inbound  — the warehouse IS the destination, goods arrive at it
       *
       * They were one combined "Location" column to begin with, holding a
       * `Rotterdam → Berlin` route for transport and a single site for
       * warehouse. That cannot be filtered or sorted: there is no way to ask
       * for "everything leaving Rotterdam" when both ends share a cell, and no
       * way to sort on either. Two columns, one concept each.
       */

      /*
       * THE ADDRESS CELL — the format the Orders list uses, four lines in one
       * column behind a single marker:
       *
       *     (pin) Oradea International Airport
       *           Calea Aradului 80
       *           410223 Oradea
       *           Romania
       *
       * Name, street, postal city, country. Read off the Orders table in Figma
       * (IvHbK3LeammCOdlHQQYxwy, node 11187:289914), where the columns are
       * First Pickup Address and Last Delivery Address.
       *
       * The OMS warehouse table (29Ixi12L8wlQPTh3oVg0ao, node 103:57407)
       * splits the same information across TWO columns per end — Ship From plus
       * Loading Address, Ship To plus Delivery Address, with the address on one
       * line. Going generic means one column per end for both domains, in the
       * Orders format, rather than four columns that only warehouse fills.
       *
       * Every end gets `location-dot`, warehouse included. An earlier revision
       * gave the warehouse end the truck-ramp-box dock glyph; with Category now
       * saying "Warehouse" in its own column that was saying the same thing
       * twice, and a per-domain glyph is the opposite of generic.
       *
       * No `whitespace-nowrap` here: under `table-layout: fixed` a long name
       * ("Elektro Components Sp. z o.o.") has to be able to wrap inside its
       * column rather than overflow it.
       */
      function addressCell(end) {
        return `<td class="mat-mdc-cell mdc-data-table__cell">
          <span class="flex items-center gap-2">
            <span class="text-neutral-caption">${icon('location-dot')}</span>
            <span class="flex flex-col text-cca-base-sm text-neutral-body">
              <span>${end.name}</span>
              <span class="text-neutral-caption">${end.street}</span>
              <span class="text-neutral-caption">${end.city}</span>
              <span class="text-neutral-caption">${end.country}</span>
            </span>
          </span>
        </td>`;
      }

      /*
       * Which end is which, whichever domain the record came from. Branch on
       * WAREHOUSE, not transport: warehouse records are the only ones carrying
       * origin/destination directly, while transport AND invoice both use
       * pickup/delivery. Testing for transport sent invoice rows down the
       * warehouse branch, where o.origin is undefined, and the whole table
       * rendered empty.
       */
      function ends(o) {
        return o.domain === 'warehouse'
          ? { origin: o.origin, destination: o.destination }
          : { origin: o.pickup, destination: o.delivery };
      }

      /*
       * THE DATE/TIME CELL — cca-date-cell, laid out as the app and the Figma
       * both lay it out: a "Between" label, a clock, then each end as a date
       * over a time, side by side with an arrow between.
       *
       * This went through a stacked, one-line-per-end version to save column
       * width. The Figma settles it: the Orders table puts them side by side
       * and is 3193px wide, so the width is the design's own choice and the
       * table is meant to scroll.
       *
       * cca-date-cell is the design system's date cell — libs/ui/src,
       * isDesignSystem true. Its stylesheet is 34 bytes (`display: flex`)
       * because the layout lives in its Angular template, which the export does
       * not ship, so the internals are composed here.
       */
      function windowEnds(end) {
        const w = end.window;
        if (!w) return null;
        if (typeof w === 'string') {
          return { from: { date: end.date, time: w }, to: { date: end.date, time: w } };
        }
        return {
          from: { date: end.date, time: w.from },
          to: { date: w.toDate || end.date, time: w.to || w.from },
        };
      }

      function dateTimeCell(end) {
        const w = windowEnds(end);
        if (!w) {
          return `<td class="mat-mdc-cell mdc-data-table__cell">
            <cca-date-cell class="text-cca-base-sm text-neutral-caption">${
              end.slotStatus || '—'
            }</cca-date-cell>
          </td>`;
        }
        const stack = (e) => `
          <span class="flex flex-col">
            <span class="text-cca-base-sm text-neutral-body whitespace-nowrap">${e.date}</span>
            <span class="text-cca-base-sm text-neutral-body whitespace-nowrap">${e.time}</span>
          </span>`;
        return `<td class="mat-mdc-cell mdc-data-table__cell">
          <cca-date-cell class="flex-col gap-1">
            <span class="text-cca-label-sm text-neutral-caption">Between</span>
            <span class="flex items-start gap-2">
              <span class="text-neutral-caption">${icon('clock')}</span>
              ${stack(w.from)}
              <span class="pt-0.5 text-neutral-caption">${icon('arrow-right')}</span>
              ${stack(w.to)}
            </span>
          </cca-date-cell>
        </td>`;
      }

      // Address then window, for each end, in header order.
      function endColumns(o) {
        const e = ends(o);
        return (
          addressCell(e.origin) +
          addressCell(e.destination) +
          dateTimeCell(e.origin) +
          dateTimeCell(e.destination)
        );
      }

      function renderRows() {
        const rows = visibleOrders();
        document.getElementById('orders-rows').innerHTML = rows
          .map(
            (o) => `
          <tr class="mat-mdc-row mdc-data-table__row">
            <td class="mat-mdc-cell mdc-data-table__cell">
              <button ccaButton class="cca-btn cca-btn--tertiary cca-btn--icon-only" aria-label="Row actions">${icon('ellipsis-vertical')}</button>
            </td>
            <td class="mat-mdc-cell mdc-data-table__cell">${categoryBadge(o.domain)}</td>
            <td class="mat-mdc-cell mdc-data-table__cell">${
              o.type
                ? smallLabelBadge(o.type, TYPE_FLAVOR)
                : notApplicable('Invoice orders have no order type')
            }</td>
            <td class="mat-mdc-cell mdc-data-table__cell">
              <!-- By SCREEN NAME, not folder — _shared/routes.js resolves it, and
                   the click explains itself until the detail exists. -->
              <a class="cca-btn cca-btn--link whitespace-nowrap" href="#"
                 data-screen="orders.detail" data-params='{"id":"${o.id}"}'>${o.id}</a>
            </td>
            <td class="mat-mdc-cell mdc-data-table__cell">
              <div class="flex flex-col gap-1 text-cca-base-sm text-neutral-body">
                <span class="flex items-center gap-1">${icon('building')}${o.shipperGroup}</span>
                <span class="flex items-center gap-1">${icon('users')}${o.shipperSubGroup}</span>
              </div>
            </td>
            <td class="mat-mdc-cell mdc-data-table__cell">
              <span class="text-cca-base-sm text-neutral-body">${o.salesOrganisation}</span>
            </td>
            <td class="mat-mdc-cell mdc-data-table__cell">
              <span class="text-cca-base-sm text-neutral-body">${o.shipperReference}</span>
            </td>
            <!--
              Status and Transit Status are TWO COLUMNS, side by side, as the
              Figma Orders table has them. They were stacked in one cell for
              several revisions — which also hid that they are two different
              badge components, not one badge on two lines.
            -->
            <td class="mat-mdc-cell mdc-data-table__cell">${statusBadge(o.status, o.statusFlavor)}</td>
            <td class="mat-mdc-cell mdc-data-table__cell">${
              o.transitStatus
                ? flagBadge(o.transitStatus, o.transitFlavor)
                : notApplicable(
                    o.domain === 'warehouse'
                      ? 'A warehouse order is not in transit'
                      : 'An invoice order is not in transit'
                  )
            }</td>
            ${endColumns(o)}
          </tr>`
          )
          .join('');

        document.getElementById('row-count').textContent = rows.length
          ? `1 – ${rows.length} of ${rows.length}`
          : '0 of 0';

        // data-screen links are added after routes.js ran, so re-resolve them.
        if (window.CCA_ROUTES) window.CCA_ROUTES.resolve();
      }

      function render() {
        renderViews();
        renderPinnedRow();
        renderRows();
      }

      // ------------------------------------------------------------- behaviour
      render();
    </script>
  </body>
</html>
