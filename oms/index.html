<!doctype html>
<!--
  OMS — warehouse orders in the Shipper TMS orders list
  =====================================================

  The premise: warehouse orders (OMS) stop being a separate list and join the
  transport orders already in Shipper TMS › Orders. To an operator, an Outbound
  order and the transport order collecting it are ONE job — two records only
  because the system keeps them apart.

  This prototype exists to show what that combining actually costs, because
  "put them in the same table" is not free. Four things had to change:

    1. THE TYPE BADGE SPANS EVERY DOMAIN, AS ONE COMPONENT. Brokerage, MT,
       SaaS and Own Fleet are transport; Inbound and Outbound are warehouse.
       They share a column and they share a treatment — every badge is
       `neutral emphasis-outline`, exactly as the existing orders list renders
       it.

       An earlier revision filled the warehouse ones with `accent-blue` to
       separate the domains by form. That is out: splitting one component into
       two treatments by data value stops the column being a single thing.
       Which leaves an open question — see the note at the foot of this file.

    2. ORDER TYPE IS A FILTER, NOT A CONTROL OF ITS OWN. A warehouse planner
       should not scroll past transport orders all day, so the list needs
       narrowing — but the product already has a mechanism for that, and the
       row above the table already belongs to it.

       This page carried a bespoke set of cca-chip type toggles in that row for
       several revisions. It was wrong twice: it collided with the pinned-filters
       row (see orders-pinned-filters/), and it looked like a filter without
       being one — hard-coded values the Filters drawer knew nothing about. So
       Order Type joins the filter list, and reaches the row only by being
       pinned, as any filter does.

    3. TRANSIT STATUS STOPS BEING A COLUMN. A warehouse order is not in
       transit — it is being picked, or waiting for a dock slot — so a Transit
       Status column is empty on every warehouse row, and a column that is
       blank half the time earns its width badly. It folds into Status as a
       second line instead: state on top, timeliness under it, present only
       where it means something. Absence in a stacked cell reads as "does not
       apply" without needing a dash and a tooltip to explain itself.

       This was found by building it. The first version kept the column and put
       an em dash in it; at 1600px the table then needed 10 columns in 916px of
       page, cells wrapped to four lines and rows were 153px tall. The column
       was the thing to cut.

    4. WHERE AND WHEN BECOME REAL COLUMNS, and Linked is added.

       Both record types have two ends — the warehouse is simply one of them
       (origin for an Outbound, destination for an Inbound). That is the honest
       shared concept, and it is what makes the two comparable in one table at
       all. It started as a single "Location" column holding a
       `Rotterdam → Berlin` route, which turned out to be unfilterable: no way
       to ask for everything leaving Rotterdam when both ends share a cell.

       So place, date and time are each their own column, per end — six in
       total, each sorted on separately. The date and time columns both use the
       design system's own cca-date-cell rather than bare text; it needs
       linking by hand, which the <head> explains. 14 columns do not fit the
       page and the table scrolls; that is the real cost of combining, and
       worth seeing rather than hiding.

       Linked is the payoff — the counterpart records, so a fan-out (one
       Outbound, two trailers on the same lane) is visible in the list instead
       of only on a detail page.

  Everything renders from _shared/data.js. Warehouse orders live in their own
  array there and this page asks for both with `allOrders()` — see the comment
  on WAREHOUSE_ORDERS for why they are not simply appended to `orders`.

  Never write a literal opening html tag in this comment: build-screens.py reads
  data-screen off the first thing that looks like one.
-->
<html lang="en" class="light" data-screen="oms.orders">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Orders · Warehouse &amp; Transport · CtrlChain</title>

    <link rel="stylesheet" href="../design-system/dist/fonts/fonts.css" />
    <link rel="stylesheet" href="../design-system/dist/ds/index.css" />

    <!--
      ONE EXTRA STYLESHEET, which is a departure from the usual two-link rule —
      called out here rather than left to be discovered.

      ds/index.css covers the 40 documented design-system components.
      cca-date-cell is a real libs/ui/src component (the same owner as
      cca-label-badge and cca-search-field) but it lives among the ~274 product
      stylesheets under ds/components/ that index.css does not import, so it has
      to be linked by hand. Nothing else in the bundle renders a date, so a
      table with Date and Time columns cannot avoid it.

      It goes BEFORE _shared/prototype.css so the shared layer can still
      override.
    -->
    <link rel="stylesheet" href="../design-system/dist/ds/components/date-cell.css" />

    <link rel="stylesheet" href="../_shared/prototype.css" />

    <style>
      /* The bundle ships no page-level reset — the app's own index.html has it.
         Everything else this page needs is in ../_shared/prototype.css. */
      html,
      body {
        margin: 0;
        height: 100%;
      }
    </style>
  </head>

  <body>
    <cca-root>
      <cca-main>
        <div class="appContent">
          <!-- Rail and submenu are shared — see _shared/shell-markup.js. -->
          <cca-side-menu data-rail="Shipper TMS"></cca-side-menu>
          <cca-side-submenu data-submenu="shipper-tms" data-submenu-active="Orders"></cca-side-submenu>

          <cca-header>
            <div class="sticky z-10 flex h-15 w-auto max-w-full items-center border-b border-neutral-default surface-neutral-light">
              <div class="flex flex-row items-center gap-2 pl-6">
                <!-- A classless h2 is the app's own document title: 20px medium,
                     styled globally. A text-cca-* utility here would shrink it. -->
                <h2 class="text-neutral-title">Orders</h2>
              </div>
              <div data-top-bar-trailing data-initials="AF"></div>
            </div>
          </cca-header>

          <div class="page">
            <div class="page-container proto-hug flex flex-col">
              <!--
                Saved-view tabs. This is where the domain scope lives (change 2):
                `All orders` is the system view, `Warehouse` and `Transport` are
                saved ones. Rendered from state, as in orders-pinned-filters —
                a saved view carries a home icon and a kebab, so it is composed
                from utilities rather than being a mat-tab-group.
              -->
              <div class="flex items-center" id="view-tabs"></div>

              <!-- Toolbar -->
              <div class="mt-4 flex items-center gap-4">
                <div class="max-w-140 min-w-60 flex-1">
                  <cca-search-field class="proto-no-subscript" style="display: block">
                    <mat-form-field class="mat-mdc-form-field mat-mdc-form-field-type-mat-input mat-form-field-appearance-outline mat-primary mat-mdc-form-field-has-icon-prefix w-full">
                      <div class="mat-mdc-text-field-wrapper mdc-text-field mdc-text-field--outlined mdc-text-field--no-label">
                        <div class="mat-mdc-form-field-flex">
                          <div class="mdc-notched-outline">
                            <div class="mdc-notched-outline__leading mat-mdc-notch-piece"></div>
                            <div class="mdc-notched-outline__notch mat-mdc-notch-piece"></div>
                            <div class="mdc-notched-outline__trailing mat-mdc-notch-piece"></div>
                          </div>
                          <div class="mat-mdc-form-field-icon-prefix">
                            <cca-icon><mat-icon class="mat-icon notranslate cca-icon cca-icon-search mat-ligature-font mat-icon-inline" aria-hidden="true"></mat-icon></cca-icon>
                          </div>
                          <div class="mat-mdc-form-field-infix">
                            <!-- Placeholder widened: a warehouse order is found by
                                 its own reference, not a transport one. -->
                            <input id="orders-search" type="text" class="mat-mdc-input-element mdc-text-field__input" placeholder="Search by order, shipper or warehouse reference" value="" autocomplete="off" />
                          </div>
                        </div>
                      </div>
                      <div class="mat-mdc-form-field-subscript-wrapper mat-mdc-form-field-bottom-align"></div>
                    </mat-form-field>
                  </cca-search-field>
                </div>

                <button ccaButton class="cca-btn cca-btn--subtle" id="filters-button" aria-haspopup="dialog" aria-expanded="false">
                  <cca-icon><mat-icon class="mat-icon notranslate cca-icon cca-icon-filter mat-ligature-font mat-icon-inline" aria-hidden="true"></mat-icon></cca-icon>
                  Filters
                </button>

                <div class="ml-auto flex items-center gap-4">
                  <button ccaButton class="cca-btn cca-btn--secondary cca-btn--icon-only" aria-label="Export">
                    <cca-icon><mat-icon class="mat-icon notranslate cca-icon cca-icon-export mat-ligature-font mat-icon-inline" aria-hidden="true"></mat-icon></cca-icon>
                  </button>
                  <button ccaButton class="cca-btn cca-btn--secondary cca-btn--icon-only" aria-label="More actions">
                    <cca-icon><mat-icon class="mat-icon notranslate cca-icon cca-icon-ellipsis-vertical mat-ligature-font mat-icon-inline" aria-hidden="true"></mat-icon></cca-icon>
                  </button>
                </div>
              </div>

              <!--
                PINNED FILTERS. This row belongs to them and nothing else.

                It held a bespoke set of cca-chip order-type toggles for a
                while, which was wrong: this slot is already spoken for by the
                pinned-filters mechanism (see orders-pinned-filters/), so a
                second chip set here either collides with pinned chips or
                silently replaces them. Worse, it LOOKED like a filter without
                being one — hard-coded values that the Filters drawer knew
                nothing about.

                Order Type is a filter like any other. It belongs in the drawer,
                and it reaches this row only when a user pins it. The chip is
                the real pinned-filter chip — a pin glyph and the filter's name,
                markup shared with orders-pinned-filters, which is where the
                pin/unpin flow itself is prototyped.
              -->
              <div class="mt-3 flex flex-wrap items-center gap-3" id="pinned-filters-row"></div>

              <!-- The combined table -->
              <div class="mt-4 overflow-x-auto">
                <table class="mat-mdc-table mdc-data-table__table min-w-max" style="width: 100%">
                  <thead>
                    <tr class="mat-mdc-header-row mdc-data-table__header-row" role="row">
                      <th class="mat-mdc-header-cell mdc-data-table__header-cell" role="columnheader">Actions</th>
                      <!-- The order-type badge is its own column in the design, with no header. -->
                      <th class="mat-mdc-header-cell mdc-data-table__header-cell w-22" role="columnheader"></th>
                      <th class="mat-mdc-header-cell mdc-data-table__header-cell" role="columnheader">Reference Number</th>
                      <th class="mat-mdc-header-cell mdc-data-table__header-cell" role="columnheader">Shipper Group</th>
                      <th class="mat-mdc-header-cell mdc-data-table__header-cell" role="columnheader">Sales Organisation</th>
                      <th class="mat-mdc-header-cell mdc-data-table__header-cell" role="columnheader">Shipper Reference</th>
                      <!--
                        New (change 4). Six columns where there was one
                        "Location", because every one of these is a field
                        somebody filters or sorts on, and a value sharing a cell
                        with another value can do neither.
                      -->
                      <th class="mat-mdc-header-cell mdc-data-table__header-cell" role="columnheader">Origin</th>
                      <th class="mat-mdc-header-cell mdc-data-table__header-cell" role="columnheader">First Pickup Date/Time</th>
                      <th class="mat-mdc-header-cell mdc-data-table__header-cell" role="columnheader">Destination</th>
                      <th class="mat-mdc-header-cell mdc-data-table__header-cell" role="columnheader">Last Delivery Date/Time</th>
                      <!-- Transit status folds in here (change 3) — it applied to
                           transport only, so as its own column it was empty on
                           every warehouse row. -->
                      <th class="mat-mdc-header-cell mdc-data-table__header-cell" role="columnheader">Status</th>
                      <!-- New (change 4). -->
                      <th class="mat-mdc-header-cell mdc-data-table__header-cell" role="columnheader">Linked</th>
                    </tr>
                  </thead>
                  <tbody class="mdc-data-table__content" id="orders-rows"></tbody>
                </table>

                <!-- Pagination. The app uses mat-paginator; the bundle ships no
                     static markup for it, so this is composed from utilities. -->
                <div class="flex items-center justify-end gap-4 py-4">
                  <span class="text-cca-label-sm text-neutral-caption">Rows per page</span>
                  <span class="flex items-center gap-2 rounded-lg border border-neutral-default px-3 py-1 text-cca-base-sm text-neutral-body">
                    10
                    <cca-icon><mat-icon class="mat-icon notranslate cca-icon cca-icon-chevron-down mat-ligature-font mat-icon-inline" aria-hidden="true"></mat-icon></cca-icon>
                  </span>
                  <span class="text-cca-label-sm text-neutral-caption" id="row-count"></span>
                  <button ccaButton class="cca-btn cca-btn--tertiary cca-btn--icon-only" aria-label="First page" disabled>
                    <cca-icon><mat-icon class="mat-icon notranslate cca-icon cca-icon-chevrons-left mat-ligature-font mat-icon-inline" aria-hidden="true"></mat-icon></cca-icon>
                  </button>
                  <button ccaButton class="cca-btn cca-btn--tertiary cca-btn--icon-only" aria-label="Previous page" disabled>
                    <cca-icon><mat-icon class="mat-icon notranslate cca-icon cca-icon-chevron-left mat-ligature-font mat-icon-inline" aria-hidden="true"></mat-icon></cca-icon>
                  </button>
                  <button ccaButton class="cca-btn cca-btn--tertiary cca-btn--icon-only" aria-label="Next page">
                    <cca-icon><mat-icon class="mat-icon notranslate cca-icon cca-icon-chevron-right mat-ligature-font mat-icon-inline" aria-hidden="true"></mat-icon></cca-icon>
                  </button>
                  <button ccaButton class="cca-btn cca-btn--tertiary cca-btn--icon-only" aria-label="Last page">
                    <cca-icon><mat-icon class="mat-icon notranslate cca-icon cca-icon-chevrons-right mat-ligature-font mat-icon-inline" aria-hidden="true"></mat-icon></cca-icon>
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </cca-main>
    </cca-root>

    <script src="../_shared/data.js"></script>
    <script src="../_shared/screens.js"></script>
    <script src="../_shared/shell-markup.js"></script>
    <script src="../_shared/routes.js"></script>
    <script src="../_shared/nav.js"></script>
    <script src="../_shared/shell.js"></script>

    <script>
      'use strict';

      // Both domains, from the shared fixtures. `orders` alone is transport-only.
      const ALL = window.CCA_DATA.allOrders();

      /*
       * Only the system view. Warehouse and Transport were saved views here at
       * one point and came out again: a second scope mechanism sitting next to
       * the type chips meant two controls that could disagree, and a reviewer
       * having to work out which one won. The chips do the whole job.
       *
       * With one view there are no tabs to show — a single tab is not a choice,
       * and the app agrees: Contracted Lanes has no saved views and renders no
       * tab row. The strip below is written and dormant, so adding a view back
       * brings it and its kebab menu back with no other change.
       */
      const VIEWS = [{ name: 'All', system: true }];
      let activeView = 'All';

      /*
       * Order types, grouped by domain. The flavour is the domain (change 1):
       * transport keeps the `neutral` the list uses today, warehouse takes
       * `accent-blue`. Both are real cca-label-badge flavours — see
       * design-system/dist/ds/components/label-badge.css.
       */
      /*
       * The order-type vocabulary, and which domain each type belongs to.
       *
       * Nothing renders from this any more — the badge just prints `o.type` —
       * but it is the list the Order Type filter offers, and it records the
       * grouping that the list itself cannot show. Kept here so the next person
       * does not have to reconstruct it from the fixtures.
       */
      const TYPES = [
        { name: 'Brokerage', domain: 'transport' },
        { name: 'MT', domain: 'transport' },
        { name: 'SaaS', domain: 'transport' },
        { name: 'Own Fleet', domain: 'transport' },
        { name: 'Inbound', domain: 'warehouse' },
        { name: 'Outbound', domain: 'warehouse' },
      ];

      /*
       * ONE COMPONENT FOR EVERY TYPE, whichever domain it belongs to.
       *
       * An earlier revision filled the warehouse badges with `accent-blue` and
       * left transport outlined, so the two domains differed in form. That is
       * out: a badge is a badge, and splitting one component into two
       * treatments by data value makes the column stop being a single thing.
       * The domain is legible from the type word itself — Inbound and Outbound
       * are not transport words — and from the Linked column beside it.
       *
       * So every badge is `neutral emphasis-outline`, exactly as the existing
       * orders list renders it.
       */
      const TYPE_FLAVOR = 'neutral';

      // ------------------------------------------------------------- helpers
      const icon = (name) =>
        `<cca-icon><mat-icon class="mat-icon notranslate cca-icon cca-icon-${name} mat-ligature-font mat-icon-inline" aria-hidden="true"></mat-icon></cca-icon>`;

      const labelBadge = (text, flavor) =>
        `<cca-label-badge><div class="flex w-fit items-center gap-1 rounded-lg whitespace-nowrap px-1.5 py-1 text-cca-base-sm leading-5 font-normal ${flavor} emphasis-outline">${text}</div></cca-label-badge>`;

      // Smaller than the documented label badge: the design system has no size
      // modifier, so the size is the type utility one step down the scale with
      // tighter vertical padding. Matches the existing orders list.
      // Smaller than the documented label badge: the design system has no size
      // modifier, so the size is the type utility one step down the scale with
      // tighter vertical padding. Matches the existing orders list.
      const smallLabelBadge = (text, flavor) =>
        `<cca-label-badge><div class="flex w-fit items-center gap-1 rounded-lg whitespace-nowrap px-1.5 py-0.5 text-cca-label-sm leading-4 font-normal ${flavor} emphasis-outline">${text}</div></cca-label-badge>`;

      const statusBadge = (text, flavor) =>
        `<cca-status-badge><div class="flex w-fit items-center justify-center rounded-full py-1 whitespace-nowrap font-medium px-2 text-cca-label-sm ${flavor}">${text}</div></cca-status-badge>`;

      /*
       * "Does not apply", said out loud — used by the Linked column, where a
       * blank cell would read as missing data. The title says WHY there is no
       * counterpart, which is the part a reader cannot infer. aria-label carries
       * it too, since a screen reader gets nothing from a dash.
       */
      const notApplicable = (why) =>
        `<span class="text-cca-base-sm text-neutral-caption" title="${why}" aria-label="${why}">—</span>`;

      // ------------------------------------------------------- what's on screen
      /*
       * Everything, unfiltered. Narrowing this list is the Filters drawer's
       * job and the pinned row's — see orders-pinned-filters/, where that flow
       * is prototyped. This page is about the combined table itself.
       */
      const visibleOrders = () => ALL;

      /*
       * Pinned filters.
       *
       * The same shape orders-pinned-filters uses: a filter knows its name and
       * whether it is pinned, and only the pinned ones reach the row above the
       * table. Order Type is the new entry — the one this page adds — and it is
       * pinned here so the row is not empty in a review.
       *
       * `showPinned` is the drawer toggle. It is true here because the toggle
       * itself is prototyped next door; this page only needs to show that
       * Order Type takes its place among the existing filters rather than
       * inventing a control beside them.
       */
      const FILTERS = [
        { name: 'Order Type', pinned: true },
        { name: 'Account Manager', pinned: true },
        { name: 'Assigned Operator', pinned: false },
        { name: 'Carrier Assignment Status', pinned: false },
        { name: 'Customer Invoice Status', pinned: false },
      ];
      let showPinned = true;

      /*
       * The real pinned-filter chip — a pin glyph and the filter's name, on the
       * neutral-dark surface. Markup shared with orders-pinned-filters so the
       * two pages cannot drift. `pinned` is the icon name; `pin` does not exist
       * in the font.
       */
      function renderPinnedRow() {
        const row = document.getElementById('pinned-filters-row');
        const pinned = FILTERS.filter((f) => f.pinned);
        row.hidden = !showPinned || pinned.length === 0;
        row.innerHTML = pinned
          .map(
            (f) => `
          <span class="flex max-w-80 items-center gap-1 rounded-lg surface-neutral-dark px-2 py-1 text-cca-base text-neutral-body">
            ${icon('pinned')}
            <span class="truncate">${f.name}</span>
          </span>`
          )
          .join('');
      }

      // ------------------------------------------------------------ saved views
      function renderViews() {
        if (VIEWS.length < 2) {
          // Including the filler, or an empty rule would hang under the toolbar
          // with no tabs above it.
          document.getElementById('view-tabs').innerHTML = '';
          return;
        }

        const tab = (v) => {
          const active = v.name === activeView;
          return `
            <div class="flex h-12 w-40 shrink-0 cursor-pointer items-center justify-center gap-1.5 overflow-clip surface-neutral-light px-3 py-2 ${
              active ? 'border-b-2 border-brand-default' : 'border-b border-neutral-default'
            }" role="tab" aria-selected="${active}" data-view="${v.name}">
              ${v.system ? icon('home') : ''}
              <span class="truncate text-cca-label-lg ${active ? 'text-brand-default' : 'text-neutral-caption'}">${v.name}</span>
              ${
                active && !v.system
                  ? `<button ccaButton class="cca-btn cca-btn--icon cca-btn--icon-only cca-btn--x-small" aria-label="View options">${icon('ellipsis-vertical')}</button>`
                  : ''
              }
            </div>`;
        };

        document.getElementById('view-tabs').innerHTML =
          VIEWS.map(tab).join('') +
          // Filler keeps the bottom border running to the edge of the row.
          '<div class="h-12 flex-1 border-b border-neutral-default surface-neutral-light"></div>';
      }

      // ------------------------------------------------------------- the table
      /*
       * Origin and Destination (change 4).
       *
       * This is the column pair that makes the two record types genuinely
       * comparable, and it is also why they belong in one table at all: a
       * transport order and a warehouse order BOTH have two ends. The warehouse
       * is simply one of them —
       *
       *   Outbound — the warehouse IS the origin, goods leave it
       *   Inbound  — the warehouse IS the destination, goods arrive at it
       *
       * They were one combined "Location" column to begin with, holding a
       * `Rotterdam → Berlin` route for transport and a single site for
       * warehouse. That cannot be filtered or sorted: there is no way to ask
       * for "everything leaving Rotterdam" when both ends share a cell, and no
       * way to sort on either. Two columns, one concept each.
       */

      /*
       * Transport records carry a postal city ("3072 AP Rotterdam"); warehouse
       * records carry a bare one. Strip a leading postcode — digits, then an
       * optional two-letter Dutch suffix — so the two domains line up in the
       * same column instead of one being visibly noisier than the other.
       */
      const cityName = (city) => city.replace(/^(?:\d[\d\s]*)?(?:[A-Z]{2}\s+)?/, '');

      /*
       * Which end is which, whichever domain the record came from.
       *
       * Transport records predate the warehouse ones and carry `window` as a
       * plain time string; warehouse records carry { from, to }. Normalised
       * here rather than in the fixture, so the transport shape other
       * prototypes already read is left alone.
       */
      function ends(o) {
        return o.domain === 'transport'
          ? { origin: o.pickup, destination: o.delivery, dcSide: null }
          : { origin: o.origin, destination: o.destination, dcSide: o.warehouseSide };
      }

      /*
       * The warehouse end gets the loading-dock glyph, the other end a plain
       * location marker. Both names checked against
       * design-system/dist/tokens/icons.json rather than guessed — truck-ramp-box
       * and location-dot are real; `warehouse` and `pin` are not.
       */
      /*
       * Place, date and time are three COLUMNS per end, not three lines in one
       * cell — six columns across the two ends.
       *
       * Two reasons they cannot share a cell. There is no component that renders
       * a date and a time together: cca-date-time-detail and cca-date-cell exist
       * but are deep app components outside ds/index.css, and cca-date-cell is
       * only `display: flex`. And a value sharing a cell cannot be sorted or
       * filtered on — "leaving Rotterdam", "leaving on the 26th" and "leaving
       * before 08:00" are three different questions, and a table answers them
       * only if each is its own column.
       *
       * The cost is width: 14 columns do not fit the page, so the table scrolls
       * horizontally. It buys shorter rows in exchange, since every one of these
       * cells is now a single line.
       */
      function placeCell(end, isDc) {
        return `<td class="mat-mdc-cell mdc-data-table__cell">
          <span class="flex items-center gap-1 whitespace-nowrap text-cca-base-sm text-neutral-body">${
            icon(isDc ? 'truck-ramp-box' : 'location-dot')
          }${cityName(end.city || end.name)}</span>
        </td>`;
      }

      /*
       * THE DATE/TIME CELL — cca-date-cell, composed to match the running app.
       *
       * cca-date-cell is the design system's date cell: owner libs/ui/src,
       * isDesignSystem true in the bundle manifest. Its stylesheet is 34 bytes
       * (`display: flex`) because the layout lives in its Angular TEMPLATE, and
       * the export ships CSS only — so the internals are composed here from
       * tokens and utilities to match what the app renders:
       *
       *     Between
       *     (clock) Tue, 25 Aug 2026  ->  Tue, 25 Aug 2026
       *             08:00                 08:00
       *
       * A "Between" label, a clock, then both ends of the window as a date over
       * a time, with an arrow between them.
       *
       * NOTE ON FIDELITY: the app prints BOTH ends in full even when they are
       * identical, so a point in time reads "Between … 08:00 -> … 08:00". That
       * repetition is real and this reproduces it rather than quietly improving
       * it — a prototype that renders the component differently from the
       * product is not showing the component. It is also the honest baseline
       * for deciding whether to change it.
       *
       * Earlier revisions of this page split date and time into four separate
       * columns and dropped the label, clock and arrow. That is why the header
       * wording is the app's own ("First Pickup Date/Time") rather than
       * invented: the whole window is one cell again, as the product has it.
       */

      /*
       * Both ends as { date, time }, whichever domain and shape the record
       * carries. Transport records hold `window` as a single time string; a
       * point in time therefore has `to` equal to `from`, which is exactly what
       * makes the app's cell repeat itself. Warehouse records hold
       * { from, to, toDate }, where toDate is set only across midnight.
       */
      function windowEnds(end) {
        const w = end.window;
        if (!w) return null;
        if (typeof w === 'string') {
          return { from: { date: end.date, time: w }, to: { date: end.date, time: w } };
        }
        return {
          from: { date: end.date, time: w.from },
          to: { date: w.toDate || end.date, time: w.to || w.from },
        };
      }

      function dateTimeCell(end) {
        const w = windowEnds(end);

        // No dock slot booked yet — the status is the value, and there is no
        // window to lay out.
        if (!w) {
          return `<td class="mat-mdc-cell mdc-data-table__cell">
            <cca-date-cell class="text-cca-base-sm text-neutral-caption">${
              end.slotStatus || '—'
            }</cca-date-cell>
          </td>`;
        }

        const stack = (e) => `
          <span class="flex flex-col">
            <span class="text-cca-base-sm text-neutral-body whitespace-nowrap">${e.date}</span>
            <span class="text-cca-base-sm text-neutral-body whitespace-nowrap">${e.time}</span>
          </span>`;

        return `<td class="mat-mdc-cell mdc-data-table__cell">
          <cca-date-cell class="flex-col gap-1">
            <span class="text-cca-label-sm text-neutral-caption">Between</span>
            <span class="flex items-start gap-2">
              <span class="text-neutral-caption">${icon('clock')}</span>
              ${stack(w.from)}
              <span class="pt-0.5 text-neutral-caption">${icon('arrow-right')}</span>
              ${stack(w.to)}
            </span>
          </cca-date-cell>
        </td>`;
      }

      // Place then window, for each end, in header order.
      function endColumns(o) {
        const e = ends(o);
        return (
          placeCell(e.origin, e.dcSide === 'origin') +
          dateTimeCell(e.origin) +
          placeCell(e.destination, e.dcSide === 'destination') +
          dateTimeCell(e.destination)
        );
      }

      /*
       * Linked (change 4) — the counterpart records. This column is the reason
       * the two lists are being merged at all: it makes the relationship visible
       * where the work happens, instead of only on a detail page.
       *
       * One link resolves to a direct link. Several show a count, because naming
       * two references in a table cell is unreadable and the detail page is
       * where a fan-out belongs. No links is a real state, not missing data —
       * an Inbound whose supplier arranges its own haulage has none.
       */
      function linkedCell(o) {
        const links = o.linked || [];
        if (!links.length) {
          return notApplicable(
            o.domain === 'warehouse'
              ? 'No transport order — haulage arranged by the supplier'
              : 'No warehouse order on this transport'
          );
        }
        /*
         * Always a count, never a reference — for two reasons.
         *
         * Consistency: an earlier version printed the full reference when there
         * was one link and "2 orders" when there were more, so the column
         * changed what kind of thing it showed depending on the row.
         *
         * Width: a reference is ~175px of column, and the tenth column was
         * already past the edge of the page. The count is ~100px and brings the
         * table back inside it.
         *
         * The link still resolves — to the counterpart itself when there is one,
         * and to this order's own detail when there are several, since that is
         * where a fan-out is actually listed.
         */
        const target = links.length === 1 ? links[0] : o.id;
        return `
          <a class="proto-header-link flex items-center gap-1 text-cca-base-sm whitespace-nowrap" href="#"
             data-screen="orders.detail" data-params='{"id":"${target}"}'
             title="${links.join(', ')}">
            ${icon('link')}${links.length} order${links.length === 1 ? '' : 's'}
          </a>`;
      }

      function renderRows() {
        const rows = visibleOrders();
        document.getElementById('orders-rows').innerHTML = rows
          .map(
            (o) => `
          <tr class="mat-mdc-row mdc-data-table__row">
            <td class="mat-mdc-cell mdc-data-table__cell">
              <button ccaButton class="cca-btn cca-btn--tertiary cca-btn--icon-only" aria-label="Row actions">${icon('ellipsis-vertical')}</button>
            </td>
            <td class="mat-mdc-cell mdc-data-table__cell">${smallLabelBadge(o.type, TYPE_FLAVOR)}</td>
            <td class="mat-mdc-cell mdc-data-table__cell">
              <!-- By SCREEN NAME, not folder — _shared/routes.js resolves it, and
                   the click explains itself until the detail exists. -->
              <a class="cca-btn cca-btn--link whitespace-nowrap" href="#"
                 data-screen="orders.detail" data-params='{"id":"${o.id}"}'>${o.id}</a>
            </td>
            <td class="mat-mdc-cell mdc-data-table__cell">
              <div class="flex flex-col gap-1 text-cca-base-sm text-neutral-body">
                <span class="flex items-center gap-1 whitespace-nowrap">${icon('building')}${o.shipperGroup}</span>
                <span class="flex items-center gap-1 whitespace-nowrap">${icon('users')}${o.shipperSubGroup}</span>
              </div>
            </td>
            <td class="mat-mdc-cell mdc-data-table__cell">
              <span class="text-cca-base-sm text-neutral-body whitespace-nowrap">${o.salesOrganisation}</span>
            </td>
            <td class="mat-mdc-cell mdc-data-table__cell">
              <span class="text-cca-base-sm text-neutral-body whitespace-nowrap">${o.shipperReference}</span>
            </td>
            ${endColumns(o)}
            <td class="mat-mdc-cell mdc-data-table__cell">
              <div class="flex flex-col items-start gap-1">
                ${statusBadge(o.status, o.statusFlavor)}
                ${o.domain === 'transport' ? labelBadge(o.transitStatus, o.transitFlavor) : ''}
              </div>
            </td>
            <td class="mat-mdc-cell mdc-data-table__cell">${linkedCell(o)}</td>
          </tr>`
          )
          .join('');

        document.getElementById('row-count').textContent = rows.length
          ? `1 – ${rows.length} of ${rows.length}`
          : '0 of 0';

        // data-screen links are added after routes.js ran, so re-resolve them.
        if (window.CCA_ROUTES) window.CCA_ROUTES.resolve();
      }

      function render() {
        renderViews();
        renderPinnedRow();
        renderRows();
      }

      // ------------------------------------------------------------- behaviour
      render();
    </script>
  </body>
</html>
